# site properties and page defaults
title: SEEDS Lab
subtitle: "Subsurface Energy: Efficient Development and Storage"
description: SEEDS Lab at China University of Petroleum (East China) integrates subsurface monitoring and coupled multiphysics modeling for efficient subsurface energy development and storage.
header: images/seeds-reservoir-centered-v5.png
header-dark: true
footer: images/seeds-pressure-illustration-footer-v11.webp
footer-dark: true
proofer: false

# site social media and other links
links:
  email: liuyongzan@upc.edu.cn
  github: YongzanLiu/seeds

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - CHANGELOG.md
  - testbed.md
  - _members
  - _posts
  - _tools

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
