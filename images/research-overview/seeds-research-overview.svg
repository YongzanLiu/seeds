<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="framework-title framework-description">
<title id="framework-title">SEEDS integrated research framework</title>
<desc id="framework-description">Monitoring and experimentation, fracture geometry and evolution, and coupled reservoir processes form a reciprocal research framework around SEEDS Lab. Observations constrain fracture characterization, physics models explain monitoring responses, and characterized geometry and properties inform reservoir predictions. Applications include unconventional oil and gas, enhanced geothermal systems, and subsurface energy storage.</desc>
