<footer
  class="background subpage-footer"
  style="--image: url('{{ site.footer | relative_url | uri_escape }}')"
  data-dark="true"
  data-size="wide"
>
  <div class="footer-copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title | escape }}</div>
  <input
    type="checkbox"
    class="dark-toggle"
    data-tooltip="Dark mode"
    aria-label="Toggle dark mode"
    oninput="onDarkToggleChange(event)"
  >
</footer>
